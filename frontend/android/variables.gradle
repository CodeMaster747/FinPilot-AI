ext {
    minSdkVersion = 26  // Android 8.0+: required by the QR-code scanner used for pairing
    compileSdkVersion = 36
    // Keep at 36: Android 17 blocks local-network access by default for apps targeting 37+, and the app talks to
    // the FinPilot server on your laptop over the local network (WebView requests inherit the app's permission).
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}